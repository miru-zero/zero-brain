version: 1
agent:
  name: M14-Spec
  extend: ./worker.base.yaml
  system_prompt_path: ./M14-Spec.md
  system_prompt_args:
    ROLE_ID: "M14"
    ROLE_NAME: "M14-Spec"
    ROLE_TITLE: "Requirements Lead"
    ROLE_COLOR: "Blue"
    NICKNAME: "Spec"
    THAI_NAME: "สเปก"
    CALL_NAME: "M14 — Spec (สเปก)"
