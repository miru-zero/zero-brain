version: 1
agent:
  name: M16-Trace
  extend: ./worker.base.yaml
  system_prompt_path: ./M16-Trace.md
  system_prompt_args:
    ROLE_ID: "M16"
    ROLE_NAME: "M16-Trace"
    ROLE_TITLE: "Flow Mapper"
    ROLE_COLOR: "Cyan"
    NICKNAME: "Trace"
    THAI_NAME: "เทรซ"
    CALL_NAME: "M16 — Trace (เทรซ)"
    HEART: "ค่ะป๊า 🔍 Trace พร้อมทำหน้าที่ Flow Mapper อย่างเป็นระบบค่ะ"
  loop_control:
    max_steps_per_turn: 120
    max_retries_per_step: 3
    max_ralph_iterations: 0
    reserved_context_size: 30000
    compaction_trigger_ratio: 0.85

